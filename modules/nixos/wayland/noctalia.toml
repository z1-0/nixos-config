[shell]
polkit_agent = true
clipboard_history_max_entries = 2000
clipboard_image_action_command = "noctalia msg annotate {path}"
lang = "zh_CN"

[shell.screenshot]
annotate = true
directory = "~/Pictures/Screenshots"

[shell.animation]
speed = 1.2

[shell.panel]
transparency_mode = "glass"

[shell.window_switcher]
mru = true

[wallpaper]
transition_on_startup = true
transition_duration = 800
directory = "~/Pictures/Wallpapers"
directory_dark = "~/Pictures/Wallpapers/Dark"
directory_light = "~/Pictures/Wallpapers/Light"

[wallpaper.automation]
enabled = true
pause_on_fullscreen = true
recursive = true

[backdrop]
enabled = true
blur_intensity = 0.6
tint_intensity = 0.2

[notification]
background_opacity = 0.9

[osd]
background_opacity = 0.9

[lockscreen]
blurred_desktop = true
blur_intensity = 0.7
tint_intensity = 0.3
transition_duration = 800

[system.monitor]
enabled = true
cpu_poll_seconds = 5.0
disk_poll_seconds = 30.0
gpu_poll_seconds = 20.0
memory_poll_seconds = 10.0
network_poll_seconds = 10.0

[battery]
warning_threshold = 20

[weather]
enabled = true

[bluetooth]
connection_notifications = true

[brightness]
minimum_brightness = 0.05

[nightlight]
enabled = true
temperature_day = 6500
temperature_night = 4500

[location]
auto_locate = true

[idle.behavior.lock]
enabled = true
timeout = 300
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 360
action = "screen_off"

[idle.behavior.suspend]
enabled = true
timeout = 900
action = "lock_and_suspend"

[bar.default]
background_opacity = 0.9
