[shell]
clipboard_history_max_entries = 2000
clipboard_image_action_command = "noctalia msg annotate {path}"
lang = "zh_CN"

[shell.animation]
speed = 1.2

[shell.panel]
transparency_mode = "soft"

[shell.window_switcher]
mru = true

[theme]
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "~/Pictures/Wallpapers"
directory_dark = "~/Pictures/Wallpapers/Dark"
directory_light = "~/Pictures/Wallpapers/Light"
transition_duration = 800
transition_on_startup = true

[wallpaper.automation]
enabled = true
recursive = true

[lockscreen]
transition_duration = 800

[bluetooth]
connection_notifications = true

[brightness]
minimum_brightness = 0.05

[location]
auto_locate = true

[nightlight]
enabled = true

[weather]
enabled = true

[system.monitor]
enabled = true
cpu_poll_seconds = 4.0
disk_poll_seconds = 30.0
gpu_poll_seconds = 10.0
memory_poll_seconds = 4.0
network_poll_seconds = 6.0

[idle.behavior.lock]
enabled = true
action = "lock"
timeout = 300

[idle.behavior.screen-off]
enabled = true
action = "screen_off"
timeout = 360

[idle.behavior.suspend]
enabled = true
action = "lock_and_suspend"
timeout = 900
