[keybinds]

# ── Launcher & Panels ────────────────────────────────────────
"Mod" = "spawn noctalia msg panel-toggle launcher"
"Mod+Escape" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+Return" = { action = "spawn ghostty", repeat = false }
"Mod+Shift+Return" = { action = "spawn ghostty +toggle-quick-terminal", repeat = false }
"Mod+Slash" = { action = "cheatsheet-toggle", repeat = false }
"Mod+Tab" = { action = "spawn noctalia msg window-switcher hold", repeat = false }
"Mod+Shift+Tab" = { action = "spawn noctalia msg window-switcher hold reverse", repeat = false }
"Mod+V" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }

# ── Screenshots ──────────────────────────────────────────────
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Print" = { action = "spawn noctalia msg screenshot-window", repeat = false }
"Mod+Shift+Print" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }

# ── Window Close / Kill ──────────────────────────────────────
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Shift+Q" = { action = "window-kill", repeat = false }

# ── Volume / Media / Brightness (XF86 keys) ──────────────────
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true, repeat = false }
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86KbdBrightnessDown" = { action = "spawn noctalia msg keyboard-backlight-down", allow_when_locked = true }
"XF86KbdBrightnessUp" = { action = "spawn noctalia msg keyboard-backlight-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }

# ── Focus & Movement (arrows / HJKL: Left Down Up Right) ─────
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"

# ── Consume / Resize ─────────────────────────────────────────
"Mod+Ctrl+Left" = { action = "window-consume-or-expel-left", repeat = false }
"Mod+Ctrl+Right" = { action = "window-consume-or-expel-right", repeat = false }
"Mod+Alt+Left" = "window-modify-primary-extent -0.02"
"Mod+Alt+Right" = "window-modify-primary-extent +0.02"
"Mod+Alt+Up" = "window-modify-secondary-extent -0.02"
"Mod+Alt+Down" = "window-modify-secondary-extent +0.02"

# ── Window State & View ──────────────────────────────────────
"Mod+D" = { action = "workspace-toggle-show-desktop", repeat = false }
"Mod+F" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+F" = { action = "window-focus-switch-floating", repeat = false }
"Mod+M" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+M" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+R" = { action = "window-cycle-primary-extent", repeat = false }

# ── Workspaces ───────────────────────────────────────────────
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"

# ── Tab Submap ───────────────────────────────────────────────
"Mod+T" = { action = "submap tabs", repeat = false }
"submap[tabs],Mod+Left" = "column-focus-tab-previous"
"submap[tabs],Mod+Right" = "column-focus-tab-next"
"submap[tabs],Mod+H" = "column-focus-tab-previous"
"submap[tabs],Mod+L" = "column-focus-tab-next"
"submap[tabs],Mod+1" = "column-focus-tab 1"
"submap[tabs],Mod+2" = "column-focus-tab 2"
"submap[tabs],Mod+3" = "column-focus-tab 3"
"submap[tabs],Mod+4" = "column-focus-tab 4"
"submap[tabs],Mod+5" = "column-focus-tab 5"
"submap[tabs],Mod+6" = "column-focus-tab 6"
"submap[tabs],Mod+7" = "column-focus-tab 7"
"submap[tabs],Mod+8" = "column-focus-tab 8"
"submap[tabs],Mod+9" = "column-focus-tab 9"
"submap[tabs],Mod+T" = { action = "column-toggle-tabbed", repeat = false }
"submap[tabs],Mod+Shift+Left" = "column-move-tab-previous"
"submap[tabs],Mod+Shift+Right" = "column-move-tab-next"
"submap[tabs],Mod+Shift+H" = "column-move-tab-previous"
"submap[tabs],Mod+Shift+L" = "column-move-tab-next"
"submap[tabs],Mod+Shift+1" = "column-move-to-workspace 1"
"submap[tabs],Mod+Shift+2" = "column-move-to-workspace 2"
"submap[tabs],Mod+Shift+3" = "column-move-to-workspace 3"
"submap[tabs],Mod+Shift+4" = "column-move-to-workspace 4"
"submap[tabs],Mod+Shift+5" = "column-move-to-workspace 5"
"submap[tabs],Mod+Shift+6" = "column-move-to-workspace 6"
"submap[tabs],Mod+Shift+7" = "column-move-to-workspace 7"
"submap[tabs],Mod+Shift+8" = "column-move-to-workspace 8"
"submap[tabs],Mod+Shift+9" = "column-move-to-workspace 9"
"submap[tabs],Escape" = "submap reset"
